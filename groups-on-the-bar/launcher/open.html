<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atualizando grupo…</title>
    <link id="group-favicon" rel="icon" href="../icons/group-grey.svg" type="image/svg+xml">
    <script src="favicon.js"></script>
    <link rel="stylesheet" href="open.css">
  </head>
  <body>
    <main>
      <img src="../icons/icon.svg" alt="" width="72" height="72">
      <h1 id="title" data-i18n="launcher.updatingTitle">Atualizando grupo…</h1>
      <p id="message" data-i18n="launcher.updatingText">Só um instante enquanto o grupo é aberto ou salvo e fechado.</p>
      <button id="retry" type="button" hidden data-i18n="launcher.retry" data-i18n-aria-label="launcher.retry">Tentar novamente</button>
    </main>
    <script src="../translations-extra.js"></script>
    <script src="../ui-preferences.js"></script>
    <script src="open.js"></script>
  </body>
</html>
